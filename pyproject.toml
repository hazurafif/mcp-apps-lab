[project]
name = "quizmcp-apps"
version = "0.1.0"
description = "Personal FastMCP app servers — interactive Prefab UIs over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[apps]>=3.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.uv]
package = false  # plain scripts, no src layout

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # long strings/URLs; formatter handles line wrapping
